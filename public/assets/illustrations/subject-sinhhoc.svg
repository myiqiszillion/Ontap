<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bioGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="bioGradLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="bioGradDNA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="bioGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="75" fill="url(#bioGradGreen)" opacity="0.12"/>
  <circle cx="110" cy="85" r="45" fill="#22c55e" opacity="0.18" filter="url(#bioGlow)"/>

  <!-- Cellular Membrane Background Ring -->
  <g opacity="0.25" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="3,3">
    <circle cx="100" cy="100" r="68"/>
    <circle cx="100" cy="100" r="54"/>
  </g>

  <!-- 3D Double-Helix DNA Strand (Center) -->
  <g transform="translate(100, 36)">
    <!-- Hydrogen Base Pair Rungs -->
    <g stroke="#86efac" stroke-width="2.5" stroke-linecap="round">
      <line x1="-22" y1="18" x2="22" y2="18"/>
      <line x1="-16" y1="36" x2="16" y2="36"/>
      <line x1="-4" y1="54" x2="4" y2="54"/>
      <line x1="-16" y1="72" x2="16" y2="72"/>
      <line x1="-22" y1="90" x2="22" y2="90"/>
      <line x1="-14" y1="108" x2="14" y2="108"/>
      <line x1="-2" y1="124" x2="2" y2="124"/>
    </g>

    <!-- Base Pair Spherical Nodes -->
    <circle cx="-22" cy="18" r="3.5" fill="#16a34a"/>
    <circle cx="22" cy="18" r="3.5" fill="#0284c7"/>
    <circle cx="-16" cy="36" r="3.5" fill="#eab308"/>
    <circle cx="16" cy="36" r="3.5" fill="#ef4444"/>
    <circle cx="-16" cy="72" r="3.5" fill="#0284c7"/>
    <circle cx="16" cy="72" r="3.5" fill="#16a34a"/>
    <circle cx="-22" cy="90" r="3.5" fill="#ef4444"/>
    <circle cx="22" cy="90" r="3.5" fill="#eab308"/>

    <!-- Strand 1 Sine Helix -->
    <path d="M -24,0 Q 24,36 -24,72 T 24,144" 
          stroke="url(#bioGradDNA)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#bioGlow)"/>

    <!-- Strand 2 Cosine Helix (Phase inverted) -->
    <path d="M 24,0 Q -24,36 24,72 T -24,144" 
          stroke="url(#bioGradGreen)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#bioGlow)"/>
  </g>

  <!-- Botanical Leaf (Photosynthesis & Ecology, Bottom Left) -->
  <g transform="translate(36, 110) rotate(-24)">
    <path d="M 0,0 C 28,-32 64,-16 68,24 C 44,48 12,28 0,0 Z" 
          fill="url(#bioGradLeaf)" stroke="#15803d" stroke-width="2" filter="url(#bioGlow)"/>
    <!-- Leaf Primary Vein -->
    <path d="M 0,0 Q 32,10 68,24" stroke="#14532d" stroke-width="2" fill="none"/>
    <!-- Lateral Veins -->
    <line x1="20" y1="4" x2="32" y2="-8" stroke="#166534" stroke-width="1.5"/>
    <line x1="36" y1="11" x2="52" y2="0" stroke="#166534" stroke-width="1.5"/>
    <line x1="24" y1="8" x2="32" y2="22" stroke="#166534" stroke-width="1.5"/>
    <line x1="42" y1="15" x2="54" y2="28" stroke="#166534" stroke-width="1.5"/>
  </g>

  <!-- Neural Synapse Branch (Upper Right) -->
  <g transform="translate(142, 52)" stroke="#4ade80" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="18" x2="24" y2="0"/>
    <line x1="24" y1="0" x2="38" y2="12"/>
    <line x1="24" y1="0" x2="34" y2="-18"/>
    
    <circle cx="0" cy="18" r="5" fill="#16a34a" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="24" cy="0" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" filter="url(#bioGlow)"/>
    <circle cx="38" cy="12" r="4" fill="#4ade80"/>
    <circle cx="34" cy="-18" r="4.5" fill="#86efac"/>
  </g>

  <!-- Chloroplast Photosynthetic Sparks -->
  <circle cx="32" cy="56" r="3" fill="#86efac" filter="url(#bioGlow)"/>
  <circle cx="168" cy="124" r="3" fill="#4ade80"/>
  <circle cx="78" cy="24" r="2.5" fill="#22c55e"/>
</svg>
