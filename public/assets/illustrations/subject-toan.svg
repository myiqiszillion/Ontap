<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mathGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mathGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="mathCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="mathCubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="mathCubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="mathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="100" cy="100" r="75" fill="url(#mathGrad1)" opacity="0.12"/>
  <circle cx="100" cy="100" r="50" fill="url(#mathGradCyan)" opacity="0.15" filter="url(#mathGlow)"/>

  <!-- Coordinate Grid Lines -->
  <g opacity="0.25" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2,3">
    <line x1="25" y1="100" x2="175" y2="100"/>
    <line x1="100" y1="25" x2="100" y2="175"/>
    <circle cx="100" cy="100" r="60"/>
    <circle cx="100" cy="100" r="35"/>
  </g>

  <!-- Isometric 3D Math Cube -->
  <g transform="translate(100, 92)">
    <!-- Top Face -->
    <polygon points="0,-36 32,-18 0,0 -32,-18" fill="url(#mathCubeTop)"/>
    <!-- Left Face -->
    <polygon points="-32,-18 0,0 0,38 -32,20" fill="url(#mathCubeLeft)"/>
    <!-- Right Face -->
    <polygon points="0,0 32,-18 32,20 0,38" fill="url(#mathCubeRight)"/>
    <!-- Inner Wireframe Accent -->
    <polyline points="-32,-18 0,0 32,-18" stroke="#93c5fd" stroke-width="1.5" fill="none"/>
    <line x1="0" y1="0" x2="0" y2="38" stroke="#93c5fd" stroke-width="1.5"/>
  </g>

  <!-- Golden Spiral Curve -->
  <path d="M 100,92 Q 135,70 145,100 T 115,145 T 75,120 T 88,85 T 105,95" 
        fill="none" stroke="url(#mathGradCyan)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" filter="url(#mathGlow)"/>

  <!-- Calculus Sine Wave Dynamic Line -->
  <path d="M 28,140 Q 55,105 85,138 T 145,138 T 175,115" 
        fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Mathematical Symbols -->
  <!-- Integral Sign -->
  <path d="M 46,62 C 40,62 36,66 38,72 L 44,115 C 46,122 42,126 36,126" 
        stroke="#60a5fa" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Sigma Sign -->
  <g transform="translate(150, 52) scale(0.9)" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="20,0 0,0 12,12 0,24 20,24"/>
  </g>
  <!-- Infinity Symbol -->
  <path d="M 50,152 C 42,145 42,159 50,152 C 58,145 58,159 50,152" 
        stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.85"/>
  <!-- Pi Symbol -->
  <g transform="translate(142, 140) scale(0.85)" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="22" y2="0"/>
    <line x1="6" y1="0" x2="6" y2="18"/>
    <path d="M 16,0 L 16,14 C 16,18 20,18 22,17"/>
  </g>

  <!-- Glowing Coordinate Nodes -->
  <circle cx="85" cy="138" r="4.5" fill="#38bdf8" filter="url(#mathGlow)"/>
  <circle cx="85" cy="138" r="2.5" fill="#ffffff"/>
  <circle cx="145" cy="138" r="4.5" fill="#60a5fa" filter="url(#mathGlow)"/>
  <circle cx="145" cy="138" r="2.5" fill="#ffffff"/>
  <circle cx="100" cy="56" r="3" fill="#93c5fd"/>
</svg>
