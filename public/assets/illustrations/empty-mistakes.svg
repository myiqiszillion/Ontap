<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="Sổ tay học tập hoàn hảo - Không còn câu sai">
  <defs>
    <linearGradient id="em-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="em-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="em-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="em-paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="em-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Aura Background -->
  <circle cx="100" cy="100" r="92" fill="url(#em-bg-grad)" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.85" />
  <circle cx="100" cy="100" r="76" fill="#047857" fill-opacity="0.08" />

  <!-- Open Academic Notebook / Journal Base -->
  <!-- Left Page -->
  <path d="M 40 148 L 40 68 Q 70 64 96 74 L 96 154 Q 70 144 40 148 Z" fill="url(#em-paper-grad)" stroke="#94a3b8" stroke-width="1.2" />
  <!-- Right Page -->
  <path d="M 160 148 L 160 68 Q 130 64 104 74 L 104 154 Q 130 144 160 148 Z" fill="url(#em-paper-grad)" stroke="#94a3b8" stroke-width="1.2" />
  <!-- Book Spine / Binding -->
  <path d="M 96 74 Q 100 72 104 74 L 104 154 Q 100 152 96 154 Z" fill="#64748b" />
  
  <!-- Left page ruled lines (soft slate) -->
  <line x1="48" y1="84" x2="88" y2="87" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="48" y1="96" x2="88" y2="99" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="48" y1="108" x2="88" y2="111" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="48" y1="120" x2="88" y2="123" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="48" y1="132" x2="78" y2="135" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right page ruled lines -->
  <line x1="112" y1="87" x2="152" y2="84" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="112" y1="99" x2="152" y2="96" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="112" y1="111" x2="152" y2="108" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="112" y1="123" x2="152" y2="120" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="112" y1="135" x2="142" y2="132" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Silk Bookmark Ribbon -->
  <path d="M 100 73 L 100 162 L 95 156 L 90 162 L 90 73 Z" fill="url(#em-gold-grad)" />

  <!-- Central Floating Mastery Shield with Checkmark -->
  <g filter="url(#em-glow)">
    <!-- Crest Shield -->
    <path d="M 100 32 Q 124 32 128 50 Q 128 78 100 94 Q 72 78 72 50 Q 76 32 100 32 Z" fill="url(#em-emerald-grad)" stroke="#a7f3d0" stroke-width="2" />
    <!-- Crisp White Checkmark -->
    <path d="M 88 52 L 96 60 L 114 42" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Intellect Stars & Radiance -->
  <g fill="url(#em-gold-grad)">
    <!-- Left sparkle -->
    <polygon points="32,54 35,46 43,43 35,40 32,32 29,40 21,43 29,46" />
    <!-- Right sparkle -->
    <polygon points="168,54 171,46 179,43 171,40 168,32 165,40 157,43 165,46" />
    <!-- Small accent sparkle -->
    <polygon points="152,148 153.5,143 158.5,141.5 153.5,140 152,135 150.5,140 145.5,141.5 150.5,143" />
    <polygon points="48,148 49.5,143 54.5,141.5 49.5,140 48,135 46.5,140 41.5,141.5 46.5,143" />
  </g>

  <!-- Laurel sprig left & right of shield -->
  <path d="M 62 58 Q 58 48 66 40 Q 64 48 70 54" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" />
  <path d="M 138 58 Q 142 48 134 40 Q 136 48 130 54" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" />

  <!-- Bottom Badge: 100% SẠCH LỖI -->
  <rect x="52" y="158" width="96" height="22" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
  <text x="100" y="173" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">100% HOÀN THIỆN</text>
</svg>
