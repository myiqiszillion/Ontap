<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="engGradSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="engGradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="engGradBook" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="engGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="75" fill="url(#engGradSky)" opacity="0.12"/>
  <circle cx="120" cy="80" r="45" fill="#f59e0b" opacity="0.14" filter="url(#engGlow)"/>

  <!-- Global Earth Sphere (Center Left) -->
  <g transform="translate(42, 42)">
    <circle cx="48" cy="48" r="44" fill="url(#engGradSky)" opacity="0.25"/>
    <circle cx="48" cy="48" r="44" stroke="#0284c7" stroke-width="2.5"/>
    
    <!-- Meridian Longitude Arcs -->
    <ellipse cx="48" cy="48" rx="24" ry="44" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
    <line x1="48" y1="4" x2="48" y2="92" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Latitude Parallel Lines -->
    <line x1="12" y1="30" x2="84" y2="30" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
    <line x1="4" y1="48" x2="92" y2="48" stroke="#0284c7" stroke-width="1.8"/>
    <line x1="12" y1="66" x2="84" y2="66" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
    
    <!-- Continental Silhouette Highlights -->
    <path d="M 28,32 Q 38,28 46,36 Q 52,48 42,56 Q 32,54 28,32 Z" fill="#38bdf8" opacity="0.45"/>
    <path d="M 60,40 Q 74,44 72,62 Q 62,68 58,52 Z" fill="#38bdf8" opacity="0.45"/>
  </g>

  <!-- Speech Dialogue Bubble 1 (English Dialogue, Top Right) -->
  <g transform="translate(108, 35)">
    <path d="M 12,0 L 58,0 C 64,0 70,5 70,12 L 70,36 C 70,42 64,48 58,48 L 26,48 L 12,58 L 16,48 L 12,48 C 5,48 0,42 0,36 L 0,12 C 0,5 5,0 12,0 Z" 
          fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#engGlow)"/>
    <!-- Sound Waves / Text inside bubble -->
    <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#0284c7">HELLO</text>
    <path d="M 14,34 L 56,34" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Speech Dialogue Bubble 2 (Amber response, Lower Right) -->
  <g transform="translate(126, 95)">
    <path d="M 10,0 L 50,0 C 56,0 60,4 60,10 L 60,30 C 60,36 56,40 50,40 L 40,40 L 44,48 L 32,40 L 10,40 C 4,40 0,36 0,30 L 0,10 C 0,4 4,0 10,0 Z" 
          fill="url(#engGradAmber)" filter="url(#engGlow)"/>
    <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#ffffff">A B C</text>
  </g>

  <!-- Open Academic Dictionary Book (Bottom Left) -->
  <g transform="translate(32, 126)">
    <!-- Book Spines & Pages -->
    <path d="M 40,16 Q 20,4 0,14 L 0,46 Q 20,36 40,46 Q 60,36 80,46 L 80,14 Q 60,4 40,16 Z" 
          fill="url(#engGradBook)" stroke="#0284c7" stroke-width="2"/>
    <line x1="40" y1="16" x2="40" y2="46" stroke="#0284c7" stroke-width="2.5"/>
    
    <!-- Text Lines on Pages -->
    <line x1="8" y1="24" x2="32" y2="24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="30" x2="28" y2="30" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="36" x2="24" y2="36" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    
    <line x1="48" y1="24" x2="72" y2="24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="30" x2="68" y2="30" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="48" y1="36" x2="64" y2="36" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Lexicon Sparks -->
  <circle cx="28" cy="46" r="3" fill="#f59e0b" filter="url(#engGlow)"/>
  <circle cx="168" cy="155" r="3.5" fill="#38bdf8"/>
  <circle cx="102" cy="18" r="2.5" fill="#0284c7"/>
</svg>
