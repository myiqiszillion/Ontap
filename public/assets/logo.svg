<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ntmk-grad-primary" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ntmk-grad-accent" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="ntmk-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Squircle Base with Rich Depth -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#ntmk-grad-primary)" filter="url(#ntmk-shadow)"/>
  
  <!-- Subtle Internal Border / Specular Rim -->
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Academic Codex Base (Open Book / Knowledge Core) -->
  <path d="M32 44.5 C26 41 18 41.5 14 43.5 V26 C18 24 26 23.5 32 27 C38 23.5 46 24 50 26 V43.5 C46 41.5 38 41 32 44.5 Z" fill="#ffffff" fill-opacity="0.95"/>
  <path d="M32 27 V44.5" stroke="#4f46e5" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Ascending Cyber Torch / Quill of Insight -->
  <path d="M32 12 L35.5 21 L32 24 L28.5 21 Z" fill="#ffffff"/>
  
  <!-- Intellect Star Sparkle -->
  <circle cx="32" cy="18" r="1.5" fill="#06b6d4"/>
  <path d="M44 15 L45 18 L48 19 L45 20 L44 23 L43 20 L40 19 L43 18 Z" fill="#ffffff" fill-opacity="0.85"/>
</svg>
